services:
  app:
    image: ghcr.io/philippehaldermans/pixie_pxl:latest
    ports:
      - "24026:7861"
      - "24027:7862"
    environment:
      - ENV=production
    command: sh -c "uv run python src/app/admin_page.py & uv run python src/app/chat.py"
    restart: on-failure
    env_file:
      - .env.prod
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
  
  db:
    env_file:
      - .env.prod
    restart: unless-stopped