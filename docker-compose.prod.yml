services:
  app:
    image: ghcr.io/philippehaldermans/pixie_pxl:latest
    ports:
      - "7861:7861"
      - "7863:7863"
      - "8080:8080"
    environment:
      - ENV=production
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - vectorstore
    networks:
      - app-network

  vectorstore:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network