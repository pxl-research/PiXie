services:
  app:
    image: ghcr.io/philippehaldermans/pixie_pxl:latest
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "24026:8000"
    environment:
      - ENV=production
    command: sh -c "uvicorn src.app.ui.startup:app --host 0.0.0.0 --port 8000"
    restart: on-failure
    env_file:
      - .env.prod
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
  
  db:
    env_file:
      - .env.prod
    restart: unless-stopped