services:
  app:
    image: ghcr.io/philippehaldermans/pixie_pxl:latest
    ports:
      - "24026:7861"
      - "24027:7862"
      - "8080:8080"
    environment:
      - ENV=production
    command: sh -c "uv run python src/app/upload.py & uv run python src/app/chat.py"
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - vectorstore
    networks:
      - app-network

  vectorstore:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network