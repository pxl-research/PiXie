services:
  tabular-db:
    image: ghcr.io/pxl-research/pixie-tabular-db:main
    platform: linux/amd64
    container_name: pixie-tabular-db
    env_file:
      - tabular.env
    restart: unless-stopped
    volumes:
      - tabular-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixie

  tabular-api:
    image: ghcr.io/pxl-research/pixie-tabular-api:main
    platform: linux/amd64
    container_name: pixie-tabular-api
    depends_on:
      - tabular-db
    env_file:
      - tabular.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixie

  core-api:
    image: ghcr.io/pxl-research/pixie-core:main
    platform: linux/amd64
    container_name: pixie-core
    depends_on:
      tabular-api:
        condition: service_healthy
    env_file:
      - core.env
    networks:
      - pixie

  chat-ui:
    image: ghcr.io/pxl-research/pixie-chat-ui:main
    platform: linux/amd64
    container_name: pixie-chat-ui
    depends_on:
      - core-api
    env_file:
      - chat.env
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "3000:3000"
    volumes:
      - ./branding:/app/dist/branding:ro
    networks:
      - pixie

  chat-ui-proxy:
    image: ghcr.io/pxl-research/pixie-chat-ui-proxy:main
    platform: linux/amd64
    container_name: pixie-chat-ui-proxy
    depends_on:
      - chat-ui
      - core-api
    env_file:
      - chat.env
    ports:
      - "8010:8000"
    networks:
      - pixie

  upload-ui:
    image: ghcr.io/pxl-research/pixie-upload-ui:main
    platform: linux/amd64
    container_name: pixie-upload-ui
    depends_on:
      - core-api
    env_file:
      - upload.env
    ports:
      - "5173:80"
    networks:
      - pixie

networks:
  pixie:
    external: true
    name: pixie-network

volumes:
  tabular-db-data:
