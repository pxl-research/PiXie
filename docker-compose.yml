x-chat-ui-base: &chat_ui_base
  # UI base (anchor, not a real service)
  image: ghcr.io/pxl-research/pixie-chat-ui:main
  platform: linux/amd64
  env_file:
    - .env
    - ./cases/${CASE_ID}/client.env
    - ./cases/${CASE_ID}/secrets.env
  environment:
    API_BASE_URL: /api
  volumes:
    # Only expose the active case's branding assets
    - ./cases/${CASE_ID}/branding:/app/dist/branding/${CASE_ID}:ro
  networks:
    pixie:
      aliases:
        - ui

x-chat-ui-proxy-env: &chat_ui_proxy_env
  PIXIE_CORE_API_BASE_URL: http://recommender-api:8000
  PIXIE_INFORMER_API_BASE_URL: http://informer-api:8000
  PIXIE_QUESTIONER_API_BASE_URL: http://questioner-api:8000
  # Audit envs come from env_file (client/secrets)

x-chat-ui-proxy-base: &chat_ui_proxy_base
  # UI proxy base (anchor, not a real service)
  image: ghcr.io/pxl-research/pixie-chat-ui-proxy:main
  platform: linux/amd64
  env_file:
    - .env
    - ./cases/${CASE_ID}/client.env
    - ./cases/${CASE_ID}/secrets.env
  networks:
    pixie:
      aliases:
        - proxy

x-upload-ui-base: &upload_ui_base
  # Upload UI base (anchor, not a real service)
  image: ghcr.io/pxl-research/pixie-upload-ui:main
  platform: linux/amd64
  env_file:
    - .env
    - ./cases/${CASE_ID}/client.env
    - ./cases/${CASE_ID}/secrets.env
  environment:
      TABULAR_PROXY_TARGET: http://tabular-api:8000/
      RAG_PROXY_TARGET: http://rag-api:8000/
  ports:
    - "127.0.0.1:5173:80"
  networks:
    - pixie

# Core backends (RAG / Informer)
services:
  rag-api:
    image: ghcr.io/pxl-research/pixie-rag-api:main
    platform: linux/amd64
    container_name: pixie-rag-api
    profiles:
      - all
      - informer
    restart: unless-stopped
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - JOB_STATE_PATH=/var/lib/pixie/jobs.json
      - JOB_MAX_CONCURRENCY=1
      - JOB_MAX_QUEUE_SIZE=8
      - RAG_OCR_ENABLED=true
      - RAG_OCR_ENGINE=tesseract
      - RAG_OCR_LANG=nld
      - REDIS_URL=redis://redis:6379/0
      - JOB_QUEUE_NAME=pixie-jobs
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8011:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - uploads:/tmp/uploads
      - job_state:/var/lib/pixie
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    networks:
      pixie:
        aliases:
          - pixie_rag_api

  rag-worker:
    image: ghcr.io/pxl-research/pixie-rag-api:main
    platform: linux/amd64
    container_name: pixie_rag_worker
    restart: unless-stopped
    profiles:
      - all
      - informer
    depends_on:
      - redis
      - qdrant
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOB_QUEUE_NAME=pixie-jobs
      - JOB_STATE_PATH=/var/lib/pixie/jobs.json
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - uploads:/tmp/uploads
    command: ["uv", "run", "python", "worker.py"]
    networks:
      - pixie

  qdrant:
    image: qdrant/qdrant:v1.16.0
    platform: linux/amd64
    container_name: pixie-qdrant
    profiles:
      - all
      - informer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334" # grpc
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image heeft geen curl; check via bash /dev/tcp op HTTP 200
      test:
        - CMD-SHELL
        - >
          bash -c 'exec 3<>/dev/tcp/localhost/6333
          && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3
          && head -n 1 <&3 | grep -q "200"'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - pixie

  redis:
    image: redis:7.4-alpine
    platform: linux/amd64
    container_name: pixie_redis
    restart: unless-stopped
    profiles:
      - all
      - informer
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pixie

  informer-api:
    image: ghcr.io/pxl-research/pixie-informer:main
    platform: linux/amd64
    container_name: pixie-informer-api
    profiles:
      - all
      - informer
    depends_on:
      rag-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    environment:
      RAG_API_URL: http://rag-api:8000
      RAG_RETRIEVE_PATH: /chunks/search
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  tabular-db:
    image: ghcr.io/pxl-research/pixie-tabular-db:main
    platform: linux/amd64
    container_name: pixie-tabular-db
    profiles:
      - all
      - recommender
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    restart: unless-stopped
    volumes:
      - tabular-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - pixie

  audit-db:
    image: ${AUDIT_DB_IMAGE:-ghcr.io/pxl-research/pixie-audit-db:main}
    platform: linux/amd64
    container_name: pixie-audit-db
    profiles:
      - all
      - informer
      - recommender
      - questioner
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    volumes:
      - audit-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - pixie

  audit-api:
    image: ${AUDIT_API_IMAGE:-ghcr.io/pxl-research/pixie-audit-api:main}
    platform: linux/amd64
    container_name: pixie-audit-api
    profiles:
      - all
      - informer
      - recommender
      - questioner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8019:8000"
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    depends_on:
      audit-db:
        condition: service_healthy
    networks:
      - pixie

  tabular-api:
    image: ghcr.io/pxl-research/pixie-tabular-api:main
    platform: linux/amd64
    container_name: pixie-tabular-api
    profiles:
      - all
      - recommender
    depends_on:
      tabular-db:
        condition: service_healthy
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    environment:
      DB_HOST: ${DB_HOST:-tabular-db}
      DB_PORT: ${DB_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  recommender:
    image: ghcr.io/pxl-research/pixie-recommender:main
    platform: linux/amd64
    container_name: pixie-recommender
    profiles:
      - all
      - recommender
    depends_on:
      tabular-api:
        condition: service_healthy
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    environment:
      TABULAR_API_URL: http://tabular-api:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  questioner-api:
    image: ghcr.io/pxl-research/pixie-questioner:main
    platform: linux/amd64
    container_name: pixie-questioner-api
    profiles:
      - all
      - questioner
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    volumes:
      - ./cases/${CASE_ID}:/case:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  chat-gateway:
    image: caddy:2.7.6
    platform: linux/amd64
    container_name: pixie-chat-gateway
    profiles:
      - all
      - informer
      - recommender
      - questioner
    env_file:
      - .env
      - ./cases/${CASE_ID}/client.env
      - ./cases/${CASE_ID}/secrets.env
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./cases/${CASE_ID}:/case:ro
    networks:
      - pixie

  chat-ui-informer:
    <<: *chat_ui_base
    platform: linux/amd64
    container_name: pixie-chat-ui-informer
    profiles:
      - informer
    depends_on:
      informer-api:
        condition: service_healthy

  chat-ui-recommender:
    <<: *chat_ui_base
    platform: linux/amd64
    container_name: pixie-chat-ui-recommender
    profiles:
      - recommender
    depends_on:
      recommender:
        condition: service_healthy

  chat-ui-all:
    <<: *chat_ui_base
    platform: linux/amd64
    container_name: pixie-chat-ui
    profiles:
      - all
    depends_on:
      informer-api:
        condition: service_healthy
      recommender:
        condition: service_healthy
      questioner-api:
        condition: service_healthy

  chat-ui-questioner:
    <<: *chat_ui_base
    platform: linux/amd64
    container_name: pixie-chat-ui-questioner
    profiles:
      - questioner
    depends_on:
      questioner-api:
        condition: service_healthy

  chat-ui-proxy-informer:
    <<: *chat_ui_proxy_base
    platform: linux/amd64
    container_name: pixie-chat-ui-proxy-informer
    profiles:
      - informer
    depends_on:
      chat-ui-informer:
        condition: service_started
      informer-api:
        condition: service_healthy
      audit-api:
        condition: service_started
    environment:
      <<: *chat_ui_proxy_env
      PIXIE_PROFILE: informer

  chat-ui-proxy-recommender:
    <<: *chat_ui_proxy_base
    platform: linux/amd64
    container_name: pixie-chat-ui-proxy-recommender
    profiles:
      - recommender
    depends_on:
      chat-ui-recommender:
        condition: service_started
      recommender:
        condition: service_healthy
      audit-api:
        condition: service_started
    environment:
      <<: *chat_ui_proxy_env
      PIXIE_PROFILE: recommender

  chat-ui-proxy-all:
    <<: *chat_ui_proxy_base
    platform: linux/amd64
    container_name: pixie-chat-ui-proxy
    profiles:
      - all
    depends_on:
      chat-ui-all:
        condition: service_started
      informer-api:
        condition: service_healthy
      recommender:
        condition: service_healthy
      questioner-api:
        condition: service_healthy
      audit-api:
        condition: service_started
    environment:
      <<: *chat_ui_proxy_env
      PIXIE_PROFILE: all

  chat-ui-proxy-questioner:
    <<: *chat_ui_proxy_base
    platform: linux/amd64
    container_name: pixie-chat-ui-proxy-questioner
    profiles:
      - questioner
    depends_on:
      chat-ui-questioner:
        condition: service_started
      questioner-api:
        condition: service_healthy
      audit-api:
        condition: service_started
    environment:
      <<: *chat_ui_proxy_env
      PIXIE_PROFILE: questioner

  upload-ui-informer:
    <<: *upload_ui_base
    platform: linux/amd64
    container_name: pixie-upload-ui-informer
    profiles:
      - informer
    depends_on:
      informer-api:
        condition: service_healthy
      rag-api:
        condition: service_healthy

  upload-ui-recommender:
    <<: *upload_ui_base
    platform: linux/amd64
    container_name: pixie-upload-ui-recommender
    profiles:
      - recommender
    depends_on:
      recommender:
        condition: service_healthy

  upload-ui-all:
    <<: *upload_ui_base
    platform: linux/amd64
    container_name: pixie-upload-ui
    profiles:
      - all
    depends_on:
      informer-api:
        condition: service_healthy
      rag-api:
        condition: service_healthy
      recommender:
        condition: service_healthy

networks:
  pixie:
    name: pixie-network

volumes:
  tabular-db-data:
  audit-db-data:
    name: pixie_audit-db-data
  qdrant_data:
  huggingface_cache:
  uploads:
  redis_data:
  job_state:
