services:
  app:
    build: .
    depends_on:
      - vectorstore
    volumes:
      - embeddings_cache:/app/embeddings_cache
      - reranker_cache:/app/reranker_cache
    networks:
      - app-network

  vectorstore:
    image: qdrant/qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network

volumes:
  qdrant_storage:
  embeddings_cache:
  reranker_cache:

networks:
  app-network: