services:
  pixie-agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - pixie-db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pixie-network

  pixie-db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pixie-network

volumes:
  postgres_data:

networks:
  pixie-network:
    name: pixie-network
    driver: bridge