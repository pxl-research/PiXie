version: '3.8'

services:
  web:
    build: .
    ports:
      - "7861:7861"
      - "7862:7862"
      - "8080:8080"
    environment:
      - "OAUTHLIB_INSECURE_TRANSPORT=1"
    env_file:
      - settings.env
    volumes:
      - .:/app
    command: tail -f /dev/null
    networks:
      - app-network

  vectorstore:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    networks:
      - app-network

networks:
  app-network: