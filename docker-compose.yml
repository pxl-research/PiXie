services:
  rag-api:
    image: ghcr.io/pxl-research/pixie-rag-api:main
    platform: linux/amd64
    container_name: pixie-rag-api
    profiles:
      - all
      - informer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - qdrant
    ports:
      - "8011:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      pixie:
        aliases:
          - pixie_rag_api

  qdrant:
    image: qdrant/qdrant:v1.16.0
    platform: linux/amd64
    container_name: pixie-qdrant
    profiles:
      - all
      - informer
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334" # grpc
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pixie

  informer-api:
    image: ghcr.io/pxl-research/pixie-informer:main
    platform: linux/amd64
    container_name: pixie-informer-api
    profiles:
      - all
      - informer
    command: uv run uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude '.venv/*' --reload-exclude '__pycache__/*'
    env_file:
      - .env
    networks:
      - pixie

  tabular-db:
    image: ghcr.io/pxl-research/pixie-tabular-db:main
    platform: linux/amd64
    container_name: pixie-tabular-db
    profiles:
      - all
      - recommender
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - tabular-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixie

  tabular-api:
    image: ghcr.io/pxl-research/pixie-tabular-api:main
    platform: linux/amd64
    container_name: pixie-tabular-api
    profiles:
      - all
      - recommender
    depends_on:
      - tabular-db
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixie

  recommender:
    image: ghcr.io/pxl-research/pixie-recommender:main
    platform: linux/amd64
    container_name: pixie-recommender
    profiles:
      - all
      - recommender
    depends_on:
      tabular-api:
        condition: service_healthy
    env_file:
      - core.env
    networks:
      - pixie

  chat-ui:
    image: ghcr.io/pxl-research/pixie-chat-ui:main
    platform: linux/amd64
    container_name: pixie-chat-ui
    depends_on:
      - informer-api
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "3000:3000"
    volumes:
      - ./branding:/app/dist/branding:ro
    networks:
      - pixie

  chat-ui-proxy:
    image: ghcr.io/pxl-research/pixie-chat-ui-proxy:main
    platform: linux/amd64
    container_name: pixie-chat-ui-proxy
    depends_on:
      - chat-ui
      - informer-api
    env_file:
      - .env
    ports:
      - "8010:8000"
    networks:
      - pixie

  upload-ui:
    image: ghcr.io/pxl-research/pixie-upload-ui:main
    platform: linux/amd64
    container_name: pixie-upload-ui
    depends_on:
      - informer-api
      - rag-api
    env_file:
      - .env
    ports:
      - "5173:80"
    networks:
      - pixie

networks:
  pixie:
    external: true
    name: pixie-network

volumes:
  qdrant_data:
  huggingface_cache:
