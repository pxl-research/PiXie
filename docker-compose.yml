x-chat-ui-base: &chat_ui_base
  # UI base (anchor, not a real service)
  image: ghcr.io/pxl-research/pixie-chat-ui:main
  platform: linux/amd64
  env_file:
    - .env
  environment:
    VITE_API_BASE_URL: http://localhost:8010
  ports:
    - "3000:3000"
  volumes:
    - ./branding:/app/dist/branding:ro
  networks:
    - pixie

x-chat-ui-proxy-base: &chat_ui_proxy_base
  # UI proxy base (anchor, not a real service)
  image: ghcr.io/pxl-research/pixie-chat-ui-proxy:main
  platform: linux/amd64
  env_file:
    - .env
  environment:
      PIXIE_CORE_API_BASE_URL: http://recommender-api:8000
      PIXIE_INFORMER_API_BASE_URL: http://informer-api:8000
  ports:
    - "8010:8000"
  networks:
    - pixie

x-upload-ui-base: &upload_ui_base
  # Upload UI base (anchor, not a real service)
  image: ghcr.io/pxl-research/pixie-upload-ui:main
  platform: linux/amd64
  env_file:
    - .env
  environment:
      TABULAR_PROXY_TARGET: http://tabular-api:8000/
      RAG_PROXY_TARGET: http://rag-api:8000/
  ports:
    - "5173:80"
  networks:
    - pixie

# Core backends (RAG / Informer)
services:
  rag-api:
    image: ghcr.io/pxl-research/pixie-rag-api:main
    platform: linux/amd64
    container_name: pixie-rag-api
    profiles:
      - all
      - informer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8011:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    networks:
      pixie:
        aliases:
          - pixie_rag_api

  qdrant:
    image: qdrant/qdrant:v1.16.0
    platform: linux/amd64
    container_name: pixie-qdrant
    profiles:
      - all
      - informer
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334" # grpc
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image heeft geen curl; check via bash /dev/tcp op HTTP 200
      test:
        - CMD-SHELL
        - >
          bash -c 'exec 3<>/dev/tcp/localhost/6333
          && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3
          && head -n 1 <&3 | grep -q "200"'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - pixie

  informer-api:
    image: ghcr.io/pxl-research/pixie-informer:main
    platform: linux/amd64
    container_name: pixie-informer-api
    profiles:
      - all
      - informer
    depends_on:
      rag-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RAG_API_URL: http://rag-api:8000
      RAG_RETRIEVE_PATH: /chunks/search
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  tabular-db:
    image: ghcr.io/pxl-research/pixie-tabular-db:main
    platform: linux/amd64
    container_name: pixie-tabular-db
    profiles:
      - all
      - recommender
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - tabular-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - pixie

  tabular-api:
    image: ghcr.io/pxl-research/pixie-tabular-api:main
    platform: linux/amd64
    container_name: pixie-tabular-api
    profiles:
      - all
      - recommender
    depends_on:
      tabular-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-tabular-db}
      DB_PORT: ${DB_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  recommender:
    image: ghcr.io/pxl-research/pixie-recommender:main
    platform: linux/amd64
    container_name: pixie-recommender
    profiles:
      - all
      - recommender
    depends_on:
      tabular-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TABULAR_API_URL: http://tabular-api:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - pixie

  chat-ui-informer:
    <<: *chat_ui_base
    container_name: pixie-chat-ui-informer
    profiles:
      - informer
    depends_on:
      informer-api:
        condition: service_healthy

  chat-ui-recommender:
    <<: *chat_ui_base
    container_name: pixie-chat-ui-recommender
    profiles:
      - recommender
    depends_on:
      recommender:
        condition: service_healthy

  chat-ui-all:
    <<: *chat_ui_base
    container_name: pixie-chat-ui
    profiles:
      - all
    depends_on:
      informer-api:
        condition: service_healthy
      recommender:
        condition: service_healthy

  chat-ui-proxy-informer:
    <<: *chat_ui_proxy_base
    container_name: pixie-chat-ui-proxy-informer
    profiles:
      - informer
    depends_on:
      chat-ui-informer:
        condition: service_started
      informer-api:
        condition: service_healthy

  chat-ui-proxy-recommender:
    <<: *chat_ui_proxy_base
    container_name: pixie-chat-ui-proxy-recommender
    profiles:
      - recommender
    depends_on:
      chat-ui-recommender:
        condition: service_started
      recommender:
        condition: service_healthy

  chat-ui-proxy-all:
    <<: *chat_ui_proxy_base
    container_name: pixie-chat-ui-proxy
    profiles:
      - all
    depends_on:
      chat-ui-all:
        condition: service_started
      informer-api:
        condition: service_healthy
      recommender:
        condition: service_healthy

  upload-ui-informer:
    <<: *upload_ui_base
    container_name: pixie-upload-ui-informer
    profiles:
      - informer
    depends_on:
      informer-api:
        condition: service_healthy
      rag-api:
        condition: service_healthy

  upload-ui-recommender:
    <<: *upload_ui_base
    container_name: pixie-upload-ui-recommender
    profiles:
      - recommender
    depends_on:
      recommender:
        condition: service_healthy

  upload-ui-all:
    <<: *upload_ui_base
    container_name: pixie-upload-ui
    profiles:
      - all
    depends_on:
      informer-api:
        condition: service_healthy
      rag-api:
        condition: service_healthy
      recommender:
        condition: service_healthy

networks:
  pixie:
    external: true
    name: pixie-network

volumes:
  tabular-db-data:
  qdrant_data:
  huggingface_cache:
