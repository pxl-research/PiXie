services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - vectorstore
      - db
    volumes:
      - embeddings_cache:/app/embeddings_cache
      - reranker_cache:/app/reranker_cache
    networks:
      - app-network

  vectorstore:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network

  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

volumes:
  qdrant_storage:
  embeddings_cache:
  reranker_cache:
  postgres_data:

networks:
  app-network: