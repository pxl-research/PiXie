name: CI/CD Pipeline

# 1. Triggers voor de workflow
on:
  push:
    branches:
      - main  # De workflow wordt geactiveerd bij een push naar de 'main' branch

permissions:
  contents: read
  packages: write

# 2. Definieer de jobs
jobs:
  build-and-push:
    runs-on: ubuntu-latest  # De job draait op de laatste Ubuntu runner
    steps:
      # 2.1 Checkout de repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2.2 Log in op de container registry
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io  # Of je eigen registry, zoals 'docker.io' voor Docker Hub
          username: ${{ github.actor }}  # Gebruiker die de actie uitvoert
          password: ${{ secrets.CR_PAT }}  # Automatische token gegenereerd door GitHub

      # 2.3 Build en Push de Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .  # Context is de root van de repository
          push: true  # Image wordt gepusht naar de registry
          tags: ghcr.io/philippehaldermans/pixie_pxl:latest  # Vervang door je eigen gegevens
