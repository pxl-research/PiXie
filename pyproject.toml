[project]
name = "pixie"
version = "0.1.0"
description = "Een applicatie voor het verwerken van documenten met AI."
authors = [
    { name = "Philippe Haldermans", email = "philippe.haldermans@pxl.be" },
    { name = "Tom Quareme", email = "tom.quareme@pxl.be" },
    { name = "Servaas Tilkin", email = "servaas.tilkin@pxl.be" },
    { name = "Robin Schrijvers", email = "robin.schrijvers@pxl.be" }
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
  "azure-ai-documentintelligence==1.0.0b3",
  "azure-storage-blob==12.22.0",
  "bcrypt==4.2.0",
  "docling==2.8.1",
  "fastapi==0.115.5",
  "FlagEmbedding==1.2.11",
  "fuzzywuzzy==0.18.0",
  "gradio==5.5.0",
  "langchain==0.3.8",
  "langchain_community==0.3.3",
  "langchain_core==0.3.21",
  "langchain_huggingface==0.1.0",
  "langchain_openai==0.2.3",
  "langchain_qdrant==0.1.4",
  "langchain_text_splitters==0.3.0",
  "langgraph",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "psycopg2-binary==2.9.9",
  "pyarrow==14.0.1",
  "PyJWT==2.10.0",
  "pymupdf==1.24.10",
  "pypandoc==1.13",
  "pytest==8.3.3",
  "python-Levenshtein==0.26.0",
  "qdrant_client==1.10.1",
  "Werkzeug==3.0.6",
  "torch==2.2.2",
  "peft==0.12.0",
  "sentencepiece==0.2.0",
  "tiktoken==0.8.0",
  "transformers==4.44.2",
  "uvicorn[standard]==0.32.1"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"