[project]
name = "pixie"
version = "0.1.0"
description = "Een applicatie voor het verwerken van documenten met AI."
authors = [
    { name = "Philippe Haldermans", email = "philippe.haldermans@pxl.be" },
    { name = "Tom Quareme", email = "tom.quareme@pxl.be" },
    { name = "Servaas Tilkin", email = "servaas.tilkin@pxl.be" },
    { name = "Robin Schrijvers", email = "robin.schrijvers@pxl.be" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}

dependencies = [
  "bcrypt==4.2.0",
  "fastapi==0.115.5",
  "fastmcp==2.3.3",
  "gradio==5.31.0",
  "langchain==0.3.13",
  "langchain-mcp-adapters==0.1.1",
  "langchain_core==0.3.62",
  "langchain_openai==0.3.18",
  "langgraph",
  "langdetect==1.0.9",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "psycopg2-binary==2.9.10",
  "pydantic==2.11.5",
  "pyjwt==2.10.1",
  "pytest==8.3.3",
  "python-dotenv==1.1.0",
  "requests==2.32.3",
  "torch==2.6.0",
  "transformers==4.42.4",
  "uvicorn[standard]==0.32.1",
  "Werkzeug==3.0.6",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"
