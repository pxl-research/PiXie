services:
  pixie-agent:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "7861:7861"
      - "7862:7862"
      - "8111:8111"
    volumes:
      - .:/app  # Mount de huidige directory voor live code wijzigingen
    command: uv run python -m uvicorn src.startup:app --host 0.0.0.0 --port 8111
    env_file:
      - .env.dev

  pixie-db:
    env_file:
      - .env.dev